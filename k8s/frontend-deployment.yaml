apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartwish-frontend
  labels:
    app: cartwish-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cartwish-frontend
  template:
    metadata:
      labels:
        app: cartwish-frontend
    spec:
      containers:
        - name: cartwish-frontend
          image: cartwish-frontend:latest
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
